# Every step is a shell command, so nothing here runs on Node. Pages publishes the gh-pages branch.
name: Deploy the soundboard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.17"
  PYTHON_VERSION: "3.14"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # To push the built site to gh-pages.
    steps:
      - name: Check out the commit
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Test the build script
        run: uv run --no-project --python "${PYTHON_VERSION}" python -m unittest discover -s tests -t .

      - name: Check the manifest and build the site
        run: uv run --no-project --python "${PYTHON_VERSION}" python build.py

      - name: Publish to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
